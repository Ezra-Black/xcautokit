name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Race checks
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build -o xcautokit .
      - name: MCP protocol smoke (no simulator)
        run: python3 scripts/mcp_smoke_test.py --binary ./xcautokit
